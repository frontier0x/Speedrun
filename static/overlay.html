<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>Speedrun timer</title>
  <link rel="stylesheet" href="common.css" />
  <link rel="stylesheet" href="overlay.css" />
</head>
<body>
  <div class="panel" id="panel">
    <!-- Always visible: the current task and the clock. Click to open, drag to move. -->
    <div class="face" id="face" title="Click for tasks · drag to move">
      <div class="face-top">
        <span class="task" id="task"></span>
        <span class="est mono" id="est"></span>
      </div>
      <div class="clock mono" id="clock"><span id="clockMain">0:00:00</span><span class="ms" id="clockMs">.000</span></div>
      <div class="quick">
        <button class="round" id="play" title="Start">▶</button>
        <button class="round" id="split" title="Done, next task (⌘⇧↩)">✓</button>
      </div>
      <div class="progress" id="progressTrack"><div id="progress"></div></div>
    </div>

    <div class="more" id="more" hidden>
      <section class="current" id="current">
        <div class="row">
          <button class="primary" id="playBig">▶ Start</button>
          <button id="doneBig" title="Finish this task and start the next (⌘⇧↩)">✓ Done</button>
          <span class="spacer"></span>
          <span class="delta mono" id="delta"></span>
        </div>
        <label class="field">
          <span>Estimate for this task</span>
          <input id="estInput" placeholder="e.g. 30m, 1h 15m" autocomplete="off" />
        </label>
      </section>

      <ol class="list" id="list"></ol>

      <form class="field add" id="addForm">
        <label for="addInput">Add tasks</label>
        <input id="addInput" placeholder="Write copy 30m  ·  or paste a whole list" autocomplete="off" />
      </form>

      <div class="foot">
        <button class="link" id="dashBtn">Stats</button>
        <button class="link" id="endBtn" title="Save this run to Stats and start a fresh one">End run</button>
        <span class="spacer"></span>
        <button class="link" id="hideBtn" title="Hide (⌘⇧Space)">Hide</button>
      </div>
    </div>
  </div>
  <script type="module" src="../dist/renderer/overlay.js"></script>
</body>
</html>

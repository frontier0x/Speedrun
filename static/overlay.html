<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>Speedrun timer</title>
  <link rel="stylesheet" href="common.css" />
  <link rel="stylesheet" href="overlay.css" />
</head>
<body>
  <div class="panel" id="panel">
    <div class="bar drag">
      <span class="dot" id="dot"></span>
      <span class="task" id="task"></span>
      <span class="delta mono" id="delta"></span>
      <span class="time mono" id="time">0:00</span>
      <div class="ctl no-drag">
        <button class="ic" id="play" title="Start">▶</button>
        <button class="ic" id="split" title="Done, next task (⌘⇧↩)">✓</button>
        <button class="ic" id="expand" title="Tasks and settings">⌄</button>
      </div>
      <div class="progress"><div id="progress"></div></div>
    </div>

    <div class="nudge no-drag" id="nudge" hidden>
      <div id="nudgeText"></div>
      <div class="links">
        <button class="link" data-answer="back">Back to it</button>
        <button class="link" data-answer="pause">Pause</button>
        <button class="link" data-answer="allow">Part of this task</button>
      </div>
    </div>

    <div class="more no-drag" id="more" hidden>
      <div class="focus" id="focus"></div>
      <ol class="list" id="list"></ol>
      <form class="add" id="addForm">
        <input id="addInput" placeholder="Add a task  ·  e.g. Write copy 30m" autocomplete="off" />
      </form>

      <div class="import" id="import" hidden>
        <textarea id="importText" rows="7" placeholder="- Write landing copy ~45m&#10;- Build page&#10;  - Hero section 1h&#10;- [ ] Reply to emails (15m)"></textarea>
        <div class="links">
          <button class="link" id="importFile" type="button">Open file…</button>
          <span class="spacer"></span>
          <button class="link" id="importCancel" type="button">Cancel</button>
          <button class="link strong" id="importGo" type="button">Add tasks</button>
        </div>
      </div>

      <div class="look" id="look" hidden>
        <div class="swatches" id="swatches"></div>
        <input type="range" id="opacity" min="0.4" max="1" step="0.02" title="Opacity" />
      </div>

      <div class="foot links">
        <button class="link" id="importBtn">Import</button>
        <button class="link" id="focusBtn"></button>
        <button class="link" id="lookBtn">Look</button>
        <button class="link" id="dashBtn">Stats</button>
        <span class="spacer"></span>
        <button class="link" id="endBtn">End run</button>
        <button class="link" id="hideBtn" title="Hide (⌘⇧Space)">Hide</button>
      </div>
    </div>
  </div>
  <script type="module" src="../dist/renderer/overlay.js"></script>
</body>
</html>

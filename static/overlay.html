<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>Speedrun timer</title>
  <link rel="stylesheet" href="common.css" />
  <link rel="stylesheet" href="overlay.css" />
</head>
<body>
  <main class="panel" id="panel">
    <!-- The face: all you see when collapsed. Drag it to move, click it to open. -->
    <section class="face" id="face" title="Click to open, drag to move">
      <div class="task" id="task"></div>
      <div class="clock" id="clock"><span id="hms">0:00:00</span><span class="ms" id="ms">.000</span></div>
      <div class="session" id="session" hidden>
        <span class="label">Session</span>
        <span class="time" id="sessionTime">0:00:00</span>
        <span class="spacer"></span>
        <span class="saved" id="sessionSaved"></span>
      </div>
    </section>

    <!-- Shown when a session ends: what you saved against your plan. -->
    <section class="summary" id="summary" hidden>
      <div class="task">Session done</div>
      <div class="clock" id="savedClock"><span id="savedHms">0:00:00</span><span class="ms" id="savedMs">.000</span></div>
      <div class="saved-label" id="savedLabel"></div>
      <dl class="facts">
        <div><dt>Session</dt><dd id="factTotal"></dd></div>
        <div><dt>Planned</dt><dd id="factPlanned"></dd></div>
        <div><dt>Actual</dt><dd id="factActual"></dd></div>
        <div><dt>Tasks</dt><dd id="factTasks"></dd></div>
      </dl>
      <div class="row">
        <button class="text" id="summaryStats" type="button">Stats</button>
        <span class="spacer"></span>
        <button class="act primary small" id="newSession" type="button">New session</button>
      </div>
    </section>

    <section class="more" id="more" hidden>
      <div class="estimate-row">
        <button class="estimate" id="estimate" type="button"></button>
        <span class="delta" id="delta"></span>
      </div>
      <div class="picker" id="picker" hidden></div>

      <div class="actions" id="actions">
        <button class="act primary" id="play" type="button"></button>
        <button class="act" id="done" type="button" title="Finish this task and start the next (⌘⇧↩)">Done</button>
      </div>

      <ol class="list" id="list"></ol>

      <form class="add" id="addForm">
        <input id="addInput" placeholder="Add a task, e.g. Write copy 30m" autocomplete="off" />
      </form>

      <div class="paste" id="paste" hidden>
        <textarea id="pasteText" rows="7" placeholder="- Write landing copy 45m&#10;- Build page&#10;  - Hero section 1h&#10;- [ ] Reply to emails 15m"></textarea>
        <div class="row">
          <button class="text" id="pasteFile" type="button">Open a file</button>
          <span class="spacer"></span>
          <button class="text" id="pasteCancel" type="button">Cancel</button>
          <button class="act primary small" id="pasteGo" type="button">Add tasks</button>
        </div>
      </div>

      <footer class="row foot">
        <button class="text" id="pasteBtn" type="button">Paste a list</button>
        <button class="text" id="statsBtn" type="button">Stats</button>
        <span class="spacer"></span>
        <button class="text" id="endBtn" type="button" title="Stop the clock and see what you saved">End session</button>
        <button class="text" id="hideBtn" type="button" title="Hide (⌘⇧Space)">Hide</button>
      </footer>
    </section>
  </main>
  <script type="module" src="../dist/renderer/overlay.js"></script>
</body>
</html>

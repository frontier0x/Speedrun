<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>Speedrun Stats</title>
  <link rel="stylesheet" href="common.css" />
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body>
  <div class="titlebar"><span>Stats</span></div>
  <main>
    <!-- The numbers you came for: time on tasks and in pauses, today and this week. -->
    <section class="periods" id="periods"></section>
    <section class="facts" id="tiles"></section>

    <section class="panel">
      <div class="panel-head">
        <h2>Last 14 days</h2>
        <span class="legend"><i class="work"></i>Tasks <i class="pause"></i>Pauses</span>
      </div>
      <div class="chart" id="chart"></div>
    </section>

    <section class="two">
      <div class="panel runs">
        <div class="panel-head"><h2>Sessions</h2><span class="muted small" id="subtitle"></span></div>
        <ol id="runs"></ol>
      </div>
      <div class="panel detail" id="detail"></div>
    </section>
  </main>
  <div class="tooltip" id="tooltip" hidden></div>
  <script type="module" src="../dist/renderer/dashboard.js"></script>
</body>
</html>

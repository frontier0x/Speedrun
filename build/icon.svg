<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Speedrun app icon: the stopwatch with a gold lightning bolt. macOS grid: 824px tile at 100px inset. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171715"/>
      <stop offset="1" stop-color="#0b0b0a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
  <g transform="translate(100 100) scale(8.24)">
    <rect x="45" y="14" width="10" height="7" rx="2" fill="#f4f4f0"/>
    <rect x="48.25" y="20" width="3.5" height="6" fill="#f4f4f0"/>
    <circle cx="50" cy="55" r="28" fill="none" stroke="#f4f4f0" stroke-width="6"/>
    <path d="M55 34 L41 58 H51 L46 76 L61 50 H51 Z" fill="#ffcf4a" stroke="#ffcf4a" stroke-width="2" stroke-linejoin="round"/>
  </g>
</svg>

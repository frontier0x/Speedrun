name: Release

# Push a tag like v0.2.0, or run it by hand from the Actions tab, to build the .dmg files and attach them to a GitHub release.
# Run by hand, it tags the commit with the version from package.json first.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Tag the version when run by hand
        if: github.ref_type != 'tag'
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if git ls-remote --exit-code --tags origin "$tag" >/dev/null; then
            echo "$tag already exists"
          else
            git tag "$tag"
            git push origin "$tag"
          fi
      - run: npm run dist
      # One upload step, so the Apple Silicon and Intel builds land in the same release.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          shopt -s nullglob
          # Plain names that say which Mac they're for and never change, so
          # releases/latest/download/Speedrun-Apple-Silicon.dmg always gets the newest one.
          # (The zips keep electron-builder's names; latest-mac.yml points at them for updates.)
          mv "release/Speedrun-${tag#v}-arm64.dmg" release/Speedrun-Apple-Silicon.dmg
          mv "release/Speedrun-${tag#v}.dmg" release/Speedrun-Intel.dmg
          files=(release/*.dmg release/*.zip release/latest-mac.yml)
          gh release create "$tag" --verify-tag --title "Speedrun ${tag#v}" \
            --notes "Download **Speedrun-Apple-Silicon.dmg** for Macs with an M1 or newer chip, or **Speedrun-Intel.dmg** for older Intel Macs (Apple menu › About This Mac shows which you have). Open it, drag Speedrun into Applications, then the first time click Done on the warning and use Open Anyway in System Settings › Privacy & Security." \
            "${files[@]}"

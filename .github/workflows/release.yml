name: Release

# Push a tag like v0.2.0, or run it by hand from the Actions tab, to build Speedrun.dmg and attach it to a GitHub release.
# Run by hand, it tags the commit with the version from package.json first.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Tag the version when run by hand
        if: github.ref_type != 'tag'
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if git ls-remote --exit-code --tags origin "$tag" >/dev/null; then
            echo "$tag already exists"
          else
            git tag "$tag"
            git push origin "$tag"
          fi
      - run: npm run dist
      # One upload step, so the Apple Silicon and Intel builds land in the same release.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          shopt -s nullglob
          files=(release/*.dmg release/*.zip release/latest-mac.yml)
          gh release create "$tag" --verify-tag --title "Speedrun ${tag#v}" \
            --notes "Download **Speedrun-${tag#v}-arm64.dmg** for Apple Silicon Macs (M1 and newer) or **Speedrun-${tag#v}.dmg** for Intel Macs. Open it, drag Speedrun into Applications, then right-click it and choose Open the first time." \
            "${files[@]}"
